<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0b0f17" />
  <!-- Grid Matrix Dots -->
  <rect x="20" y="20" width="14" height="14" rx="3" fill="#16231d" />
  <rect x="42" y="20" width="14" height="14" rx="3" fill="#006d32" />
  <rect x="64" y="20" width="14" height="14" rx="3" fill="#26a641" />
  <rect x="20" y="42" width="14" height="14" rx="3" fill="#0e4429" />
  <rect x="42" y="42" width="14" height="14" rx="3" fill="#00ff88" filter="url(#glow)" />
  <rect x="64" y="42" width="14" height="14" rx="3" fill="#39d353" />
  <rect x="20" y="64" width="14" height="14" rx="3" fill="#26a641" />
  <rect x="42" y="64" width="14" height="14" rx="3" fill="#00ff88" filter="url(#glow)" />
  <rect x="64" y="64" width="14" height="14" rx="3" fill="#00f0ff" filter="url(#glow)" />
</svg>